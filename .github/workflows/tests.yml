name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege default: no job needs to write to the repo or its checks.
permissions:
  contents: read

# A new push to the same PR cancels the previous run instead of queuing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }}, latest compatible deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # opencv-contrib-python needs these at import time even in a
      # headless CI runner (no cv2.imshow is called by the test suite).
      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # The runner image ships its own (often stale) pip/setuptools ahead
      # of anything this repo controls; pyproject.toml's [build-system]
      # pin only reaches the isolated build backend, not this ambient
      # copy, so it has to be upgraded explicitly.
      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      # Deliberately unpinned (pyproject.toml has no upper bounds): this
      # job is the early-warning signal for a breaking upstream release,
      # separate from the "does the pinned lockfile still work" job below.
      - name: Install package (latest compatible)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  lockfile:
    name: dependency lockfile (up to date, installs clean, tests pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      - name: Install pip-tools
        run: pip install pip-tools

      # Fails if requirements*.txt drifted from pyproject.toml (e.g. a
      # dependency was added/changed without regenerating the lock).
      # Header comments are excluded from the diff: pip-compile echoes
      # the --output-file path into them verbatim, so compiling to a
      # /tmp path always differs there even when the pinned set doesn't.
      - name: Check lockfiles are up to date
        run: |
          pip-compile --quiet --output-file=/tmp/requirements.txt pyproject.toml
          pip-compile --quiet --extra=dev --output-file=/tmp/requirements-dev.txt pyproject.toml
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
          diff -u <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.txt)

      # Exactly what AGENTS.md documents for reproducible local/CI installs.
      - name: Install from lockfile
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run tests against locked versions
        run: pytest -q

  dependency-audit:
    name: dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      # Audits the exact pinned/reproducible dependency set, not whatever
      # happens to resolve as "latest" on a given day.
      - name: Install package (locked) + pip-audit
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  static-security-scan:
    name: static security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r inkwatch tools
