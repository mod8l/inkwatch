name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # opencv-contrib-python needs these at import time even in a
      # headless CI runner (no cv2.imshow is called by the test suite).
      - name: Install OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
